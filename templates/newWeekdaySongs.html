{% extends 'base.html' %}

{%block content%}

{% if session['user']['userinfo']['name'] != "Guest" %}

<div class="container-md fw-bold shadow p-3 mb-5 bg-body-tertiary rounded" id="SongNumInput">
  <div class="row align-items-start justify-content-center">
    <h2 class="text-center">Click the button to generate songs:</h2>
    <div class="row justify-content-center" id="SongSection">
      <div class="col-auto">
        <div class="text-center">

          <input class="btn btn-dark shadow border border-dark-subtle rounded-3 fs-5" type="button" id="Weekday_Songs"
            value="Get Weekday Songs" onclick="getWeekdayRecs()">

          <input class="btn-check" type="checkbox" id="exact-order" value="exact-order" autocomplete="off"
            onchange="getWeekdayRecs()">
          <label class="btn btn-dark shadow border border-dark-subtle rounded-3 fs-5" for="exact-order">
            Exact Order
          </label>

          <button class="btn btn-dark shadow border border-dark-subtle rounded-3 fs-5" type="button" id="cp_block"
            onclick="copy_order()">
            <i class="bi bi-clipboard"></i>
            Copy Order
          </button>

        </div>
      </div>
    </div>

  </div>
  <p class="text-end" id="hint-am">
    Խորհուրդ. Սեղմեք այն երգը որը ցանկանում եք բացել։
  </p>
  <p class="text-end" id="hint-en">
    Hint: Just click the song you want to open.
  </p>
</div>

<div class="container-md">
  <ol class="list-group list-group-numbered shadow p-3 mb-5 bg-body-tertiary rounded" id="song_order"
    style="display: none;">
  </ol>
</div>

<script>
  let currentSongText = '';

  function blinking_placeholder() {
    const song_order = document.getElementById('song_order');
    song_order.innerHTML = ''
    const elem = `      <li class="list-group-item">
      <div class="placeholder-glow ">
        <p aria-hidden="true">
          <span class="placeholder col-9"></span>
        </p>
        <p aria-hidden="true">
          <span class="placeholder col-6"></span>
        </p>
    </div>`
    array = [1, 2, 3, 4, 5, 6];
    array.forEach(element => {
      song_order.innerHTML += elem
    })
    song_order.style.display = 'block'
  }

  function renderSongs(songs) {
    const songOrder = document.getElementById('song_order');
    songOrder.innerHTML = '';
    currentSongText = songs.map(element => `${element['songnum']}: ${element['title']}`).join('\n');
    if (!songs.length) {
      songOrder.innerHTML = `<li class="list-group-item text-center text-muted">No matching songs found. Try toggling Exact Order off.</li>`;
      return;
    }
    songs.forEach(element => {
      const isPlaceholder = !element['songnum'];
      const openLink = isPlaceholder
        ? ''
        : `<a class="btn btn-outline-primary shadow border border-primary-subtle" href="/song/${element['book']}/${element['songnum']}">Open Song</a>`;
      songOrder.innerHTML += `
    <li class="list-group-item d-flex justify-content-between align-items-start${isPlaceholder ? ' opacity-50' : ''}">
      <div class="ms-2 me-auto">
        <div class="fw-bold">${isPlaceholder ? '' : `${element['book']}: `}${element['songnum'] ?? ''}${isPlaceholder ? '' : `: ${element['title']}`}
        </div>
          ${isPlaceholder ? element['title'] : `This song was last sang on ${element['date']} which was a ${element['weekday']}`}
          <br>
          ${openLink}
      </div>
    </li>`;
    });
  }

  async function getWeekdayRecs() {
    blinking_placeholder();
    const songOrder = document.getElementById('song_order');
    const exactOrderChk = document.getElementById('exact-order');
    const isPressed = exactOrderChk.checked;
    const url = window.location.href;
    fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        "exact-order": isPressed
      })
    })
      .then(response => response.text())
      .catch((error) => {
        console.error('Error:', error);
      })
      .then(text => {
        const songs = Object.values(JSON.parse(text));
        renderSongs(songs);
      })
  }

  function copy_order() {
    if (currentSongText) {
      const textarea = document.createElement('textarea');
      textarea.value = currentSongText;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      alert('Songs copied!');
    } else {
      alert('Please generate songs first.');
    }
  }
</script>
{% else %}
{% include 'noAccess.html' %}
{% endif %}
{%endblock%}
